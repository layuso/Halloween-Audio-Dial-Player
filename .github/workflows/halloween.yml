name: Halloween Dial - Build and Flash
on:
  workflow_dispatch:
    inputs:
      flash:
        description: 'Flash connected MCU only after backups and chip verification'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: halloween-dial-hardware
  cancel-in-progress: false
jobs:
  build:
    if: (github.repository == 'layuso/Halloween-Audio-Dial-Player' || github.repository == 'MainCreate/Halloween-Audio-Dial-Player') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, halloween-build]
    timeout-minutes: 60
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build two firmware images and flash only the verified connected MCU
        id: build
        shell: bash
        env:
          IDF_PATH: /home/layuso/esp/esp-idf
          IDF_TOOLS_PATH: /home/layuso/.espressif
          HALLOWEEN_AUTO_FLASH: ${{ inputs.flash && '1' || '0' }}
        run: |
          set -e
          set -o pipefail
          unset IDF_PYTHON_ENV_PATH
          test -f "$IDF_PATH/export.sh" || { echo "::error::Missing $IDF_PATH/export.sh"; exit 1; }
          set +u
          source "$IDF_PATH/export.sh"
          set -u
          idf.py --version
          bash scripts/ci_build.sh 2>&1 | tee "$RUNNER_TEMP/halloween-ci.log"
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halloween-dial-bin-${{ github.run_id }}
          path: |
            output/classic/*.bin
            output/s3/*.bin
            output/*/SHA256SUMS.txt
          if-no-files-found: error
      - name: Report status in issue 1
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          export RUN_LINK="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          export LAST_LINE="$(grep -E '(FLASH_(SUCCESS|SKIPPED)|HALLOWEEN_BUILD_|::error::|error:)' "$RUNNER_TEMP/halloween-ci.log" 2>/dev/null | tail -1 | cut -c1-250 || true)"
          python - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          body = 'Build: **%s**\n\n[Inspect run](%s)\n\nDiagnostic: %s' % (os.getenv('OUTCOME','unknown'), os.getenv('RUN_LINK',''), os.getenv('LAST_LINE',''))
          print(json.dumps({'body': body}))
          PY
          curl -fsSL --retry 2 -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/status.json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1/comments" || true
