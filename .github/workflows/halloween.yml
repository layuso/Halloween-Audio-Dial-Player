name: Halloween Dial - Build Host Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halloween.yml'
      - 'scripts/**'
      - 'common/**'
      - 'classic/**'
      - 's3/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halloween-dial-on-builder
  cancel-in-progress: false
jobs:
  build-host-check:
    if: github.repository == 'layuso/Halloween-Audio-Dial-Player' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, halloween-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Host and attached MCU inventory - read only
        shell: bash
        run: |
          set -eu
          echo "Host: $(hostname); User: $(id -un); Arch: $(uname -m)"
          echo 'Serial devices:'
          ls -l /dev/serial/by-id/ 2>/dev/null || true
          ls -l /dev/ttyACM* /dev/ttyUSB* 2>/dev/null || true
          echo 'ESP-IDF:'
          command -v idf.py || true
          find /home -maxdepth 4 -type f -name export.sh -path '*esp-idf*' -print 2>/dev/null | head -10
          echo 'Audio source:'
          test -f /home/layuso/Witches_Sound_cleaned_louder.mp3 && sha256sum /home/layuso/Witches_Sound_cleaned_louder.mp3 || true
          echo 'Previously installed source:'
          ls -ld /home/layuso/halloween-bluetooth-dial-src /home/layuso/Halloween-Bluetooth-Dial-source-v0.3.zip 2>/dev/null || true
      - name: Native schedule test
        shell: bash
        run: |
          set -eux
          cc -std=c11 -Wall -Wextra -Werror -Icommon common/scheduler.c tests/scheduler_test.c -o /tmp/halloween-scheduler-test
          /tmp/halloween-scheduler-test
